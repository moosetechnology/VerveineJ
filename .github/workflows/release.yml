name: Release

env:
  USERNAME: ${{ github.actor }}
  TOKEN: ${{ secrets.GITHUB_TOKEN }}
  github-token: ${{ secrets.GITHUB_TOKEN }}
  VERSION: ${{ github.event.release.tag_name }}


on:
  release:
    types: [created, edited]

jobs:
  test:
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: build fat jar
        run: ./gradlew app:shadowJar

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: 'app/build/libs/*.jar'

  notify-docker:
    if: github.event.action == 'created'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create Docker repository token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DEVNEXUS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEVNEXUS_AUTOMATION_PRIVATE_KEY }}
          owner: Evref-BL
          repositories: VerveineJ-Docker

      - name: Dispatch Docker release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh api --method POST repos/Evref-BL/VerveineJ-Docker/dispatches -f event_type=verveinej-release -f "client_payload[version]=$VERSION"
      
